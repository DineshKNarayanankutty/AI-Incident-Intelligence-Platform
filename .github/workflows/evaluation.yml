name: GenAIOps Evaluation

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Run local deterministic evaluation
        run: |
          python -m genai.evaluation.runner --prompt v1 --output outputs/evaluation/v1.json
          python -m genai.evaluation.runner --prompt v2 --output outputs/evaluation/v2.json
      # A cloud-enabled evaluation step can use Foundry credentials through OIDC.
      # No secret/API key is stored in this repository.
