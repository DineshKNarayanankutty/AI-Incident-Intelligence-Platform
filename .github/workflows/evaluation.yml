name: GenAIOps Evaluation

on:
  workflow_dispatch:
    inputs:
      backend:
        description: Evaluation backend
        required: true
        default: foundry
        type: choice
        options:
          - foundry
          - local
      min_overall:
        description: Minimum V2 overall score
        required: true
        default: "0.80"
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    environment: production
    env:
      AZURE_AI_PROJECT_ENDPOINT: ${{ vars.AZURE_AI_PROJECT_ENDPOINT }}
      FOUNDRY_AGENT_NAME: ${{ vars.FOUNDRY_AGENT_NAME }}
      FOUNDRY_BACKEND: ${{ inputs.backend == 'foundry' && 'azure' || 'local' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sign in to Azure for Foundry evaluation
        if: inputs.backend == 'foundry'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run evaluation and quality gate
        run: |
          python -m genai.evaluation.runner \
            --backend "${{ inputs.backend }}" \
            --prompt both \
            --output-dir outputs/evaluation \
            --quality-gate \
            --min-overall "${{ inputs.min_overall }}"
