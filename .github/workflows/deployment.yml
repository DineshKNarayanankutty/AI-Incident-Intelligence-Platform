name: Azure ML Deployment

on:
  workflow_dispatch:
    inputs:
      approve:
        description: Type DEPLOY to allow endpoint deployment
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: ${{ inputs.approve == 'DEPLOY' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Install Azure ML CLI extension
        run: az extension add --name ml --yes
      - name: Create/update endpoint
        run: |
          az ml online-endpoint create \
            -f azure_ml/endpoints/managed-endpoint.yml \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --workspace-name "${{ vars.AZURE_ML_WORKSPACE }}"
          az ml online-deployment create \
            -f azure_ml/endpoints/managed-deployment.yml \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --workspace-name "${{ vars.AZURE_ML_WORKSPACE }}" \
            --all-traffic

      - name: Sync scoring URI to FastAPI
        run: |
          SCORING_URI=$(az ml online-endpoint show \
            --name "${{ vars.AZURE_ML_ENDPOINT_NAME || 'incident-severity-endpoint' }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --workspace-name "${{ vars.AZURE_ML_WORKSPACE }}" \
            --query scoring_uri -o tsv)
          az webapp config appsettings set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_API_APP_NAME }}" \
            --settings AZURE_ML_SCORING_URI="$SCORING_URI"
