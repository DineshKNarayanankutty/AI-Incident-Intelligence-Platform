name: Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        default: dev

permissions:
  id-token: write
  contents: read

jobs:
  what-if:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Bicep build only
        run: az bicep build --file infra/bicep/main.bicep --stdout > /tmp/main.json
      - name: Resource-group what-if
        run: |
          az deployment group what-if             --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"             --template-file infra/bicep/main.bicep             --parameters infra/bicep/main.bicepparam
      # This workflow intentionally does NOT call `az deployment group create`.
