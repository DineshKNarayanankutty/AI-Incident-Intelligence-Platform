name: Drift Retraining

on:
  workflow_dispatch:
    inputs:
      demo_drift:
        description: Generate controlled drift data to exercise the full retraining path
        required: true
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  retraining:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Select drift-check dataset
        id: dataset
        shell: bash
        env:
          DEMO_DRIFT: ${{ inputs.demo_drift }}
        run: |
          if [ "$DEMO_DRIFT" = "true" ]; then
            python -m scripts.generate_drift_demo \
              --source data/synthetic_incidents.csv \
              --output outputs/drift_demo/synthetic_incidents_drifted.csv
            echo "path=outputs/drift_demo/synthetic_incidents_drifted.csv" >> "$GITHUB_OUTPUT"
            echo "mode=controlled-demo" >> "$GITHUB_OUTPUT"
          else
            echo "path=data/synthetic_incidents.csv" >> "$GITHUB_OUTPUT"
            echo "mode=production-reference" >> "$GITHUB_OUTPUT"
          fi

      - name: Run drift check
        run: |
          mkdir -p outputs/drift
          python -m mlops.drift_check \
            --reference data/reference/drift_baseline.json \
            --data "${{ steps.dataset.outputs.path }}" \
            --output outputs/drift/result.json

      - name: Decide whether drift requires retraining
        id: gate
        shell: bash
        run: |
          DRIFT=$(python - <<'PY'
          import json
          with open('outputs/drift/result.json', encoding='utf-8') as f:
              data = json.load(f)
          print('true' if data.get('drift_detected') else 'false')
          PY
          )
          echo "drift=$DRIFT" >> "$GITHUB_OUTPUT"
          echo "Drift detected: $DRIFT"

      # Note: evaluation_data always comes from azure_ml/pipeline.yml (fixed clean
      # data/reference/candidate_evaluation.csv). Only training_data is overridden.
      - name: Create temporary Azure ML data asset for demo retraining
        if: steps.gate.outputs.drift == 'true' && inputs.demo_drift == true
        shell: bash
        env:
          DATA_PATH: ${{ steps.dataset.outputs.path }}
          ASSET_VERSION: ${{ github.run_id }}
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          WS: ${{ vars.AZURE_ML_WORKSPACE }}
        run: |
          cat > outputs/drift-demo-data.yml <<EOF
          \$schema: https://azuremlschemas.azureedge.net/latest/data.schema.json
          type: uri_file
          name: incident-severity-drift-demo
          version: "${ASSET_VERSION}"
          path: "${GITHUB_WORKSPACE}/${DATA_PATH}"
          description: "Controlled drift dataset generated for the retraining demonstration."
          EOF
          az extension add --name ml --yes
          az ml data create \
            --file outputs/drift-demo-data.yml \
            --resource-group "$RG" \
            --workspace-name "$WS"

      - name: Submit Azure ML candidate training
        if: steps.gate.outputs.drift == 'true'
        id: submit
        shell: bash
        env:
          DEMO_DRIFT: ${{ inputs.demo_drift }}
          DATA_ASSET_VERSION: ${{ github.run_id }}
        run: |
          set -euo pipefail
          az extension add --name ml --yes
          # Only training_data may be overridden. evaluation_data always comes from
          # azure_ml/pipeline.yml (committed clean data/reference/candidate_evaluation.csv).
          SET_ARGS=()
          if [ "$DEMO_DRIFT" = "true" ]; then
            TRAINING_DATA="azureml:incident-severity-drift-demo:${DATA_ASSET_VERSION}"
            echo "Using demo Azure ML data asset: $TRAINING_DATA"
            SET_ARGS=(--set "jobs.train.inputs.training_data.path=$TRAINING_DATA")
          fi
          JOB_NAME=$(az ml job create \
            --file azure_ml/pipeline.yml \
            "${SET_ARGS[@]}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --workspace-name "${{ vars.AZURE_ML_WORKSPACE }}" \
            --query name -o tsv)
          test -n "$JOB_NAME"
          echo "job_name=$JOB_NAME" >> "$GITHUB_OUTPUT"
          echo "Azure ML candidate training job (this run): $JOB_NAME"

      - name: Stream Azure ML candidate training and require Completed
        if: success() && steps.gate.outputs.drift == 'true'
        shell: bash
        run: |
          set -euo pipefail
          JOB="${{ steps.submit.outputs.job_name }}"
          az ml job stream --name "$JOB" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --workspace-name "${{ vars.AZURE_ML_WORKSPACE }}"
          STATUS=$(az ml job show --name "$JOB" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --workspace-name "${{ vars.AZURE_ML_WORKSPACE }}" --query status -o tsv)
          echo "Job $JOB status: $STATUS"
          test "$STATUS" = "Completed"

      - name: Download this run's candidate artifacts
        if: success() && steps.gate.outputs.drift == 'true'
        id: download
        shell: bash
        run: |
          set -euo pipefail
          JOB="${{ steps.submit.outputs.job_name }}"
          DEST="outputs/candidate/${JOB}"
          rm -rf outputs/candidate
          mkdir -p "$DEST"
          az ml job download \
            --name "$JOB" \
            --output-name model_output \
            --download-path "$DEST" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --workspace-name "${{ vars.AZURE_ML_WORKSPACE }}"
          echo "Downloaded files for job $JOB:"
          find "$DEST" -type f | sort
          COUNT=$(find "$DEST" -name metrics.json | wc -l)
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Expected exactly one metrics.json for job $JOB under $DEST, found $COUNT. The pipeline output model_output was not downloaded."
            exit 1
          fi
          METRICS_PATH=$(find "$DEST" -name metrics.json)
          test -f "$(dirname "$METRICS_PATH")/model.joblib"
          echo "metrics_path=$METRICS_PATH" >> "$GITHUB_OUTPUT"
          echo "Candidate metrics for job $JOB: $METRICS_PATH"

      - name: Evaluate candidate against production model
        if: success() && steps.gate.outputs.drift == 'true'
        id: candidate_gate
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.evaluate_candidate \
            --candidate-metrics "${{ steps.download.outputs.metrics_path }}" \
            --production-metrics data/reference/production_model_metrics.json \
            --evaluation-data data/reference/candidate_evaluation.csv \
            --output outputs/candidate/gate.json

      - name: Show candidate gate result
        if: always() && steps.gate.outputs.drift == 'true'
        shell: bash
        run: |
          if [ -f outputs/candidate/gate.json ]; then cat outputs/candidate/gate.json; else echo "gate.json was not created (see earlier step)."; fi

      - name: Upload candidate gate result
        if: always() && steps.gate.outputs.drift == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: candidate-gate-${{ github.run_id }}
          path: outputs/candidate/
          if-no-files-found: warn

      - name: Determine next Azure ML model version
        if: success() && steps.gate.outputs.drift == 'true'
        id: version
        shell: bash
        run: |
          set -euo pipefail
          az ml model list \
            --name incident-severity \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --workspace-name "${{ vars.AZURE_ML_WORKSPACE }}" \
            -o json > outputs/models.json
          VERSION=$(python -m scripts.next_model_version outputs/models.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Candidate model version: $VERSION"

      - name: Register candidate model from this job's output
        if: success() && steps.gate.outputs.drift == 'true'
        shell: bash
        run: |
          set -euo pipefail
          az ml model create \
            --name incident-severity \
            --version "${{ steps.version.outputs.version }}" \
            --type custom_model \
            --path "azureml://jobs/${{ steps.submit.outputs.job_name }}/outputs/model_output" \
            --description "Candidate incident severity model generated by drift-gated retraining." \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --workspace-name "${{ vars.AZURE_ML_WORKSPACE }}"

      - name: Write promotion manifest
        if: success() && steps.gate.outputs.drift == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          gate = json.loads(Path("outputs/candidate/gate.json").read_text(encoding="utf-8"))
          manifest = {
              "model_name": "incident-severity",
              "model_version": int("${{ steps.version.outputs.version }}"),
              "candidate_model_version": int("${{ steps.version.outputs.version }}"),
              "training_job_name": "${{ steps.submit.outputs.job_name }}",
              "candidate_metrics_path": "${{ steps.download.outputs.metrics_path }}",
              "gate_passed": bool(gate["passed"]),
              "gate_checks": gate["checks"],
              "gate_thresholds": gate["thresholds"],
              "gate_delta": gate["delta"],
              "candidate": gate["candidate"],
              "production": gate["production"],
              "next_workflow": "Azure ML Blue-Green Deployment",
              "deployment_instruction": "Run the deployment workflow with this model_version; keep promote=false for candidate validation, then rerun with promote=true after validation.",
          }
          Path("outputs/candidate/promotion.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Upload candidate promotion artifact
        if: success() && steps.gate.outputs.drift == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: incident-severity-candidate-${{ steps.version.outputs.version }}
          path: outputs/candidate/promotion.json
          if-no-files-found: error

      - name: Report no-drift result
        if: steps.gate.outputs.drift != 'true'
        run: echo "No drift threshold exceeded; no retraining job submitted."