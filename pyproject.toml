[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-incident-intelligence-platform"
version = "2.0.0"
description = "AI-300 portfolio project for incident intelligence and GenAIOps."
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: requires explicitly enabled Azure credentials",
]
