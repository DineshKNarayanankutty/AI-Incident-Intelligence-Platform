$schema: https://azuremlschemas.azureedge.net/latest/pipelineJob.schema.json

type: pipeline

display_name: incident-severity-training-pipeline
experiment_name: incident-severity

settings:
  default_compute: azureml:incident-cpu-cluster
  default_datastore: azureml:workspaceblobstore

# Pipeline-level output. Without this, `az ml job download --output-name
# model_output` and `azureml://jobs/<pipeline-job>/outputs/model_output` have
# nothing to resolve on the pipeline job (the output would exist only on the
# child `train` job). The child output is bound to it below.
outputs:
  model_output:
    type: uri_folder

jobs:
  train:
    type: command
    component: ./components/train.yml

    inputs:
      training_data:
        type: uri_file
        path: azureml:incident-severity-data:1
      # Fixed clean evaluation set (committed). Never overridden by workflows.
      evaluation_data:
        type: uri_file
        path: ../data/reference/candidate_evaluation.csv

    outputs:
      model_output: ${{parent.outputs.model_output}}
